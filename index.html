<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>店舗現在庫検索</title>
<link rel="stylesheet" href="./style.css"></head>
<body><main class="wrap">
<header><div><h1>店舗現在庫検索</h1><p>月曜朝在庫 − 月曜から前日までの売れ数</p></div>
<button id="reloadBtn" class="secondary" type="button">再読込</button></header>
<section class="summary">
<div><span>基準在庫</span><strong id="baseDate">確認中…</strong></div>
<div><span>反映日</span><strong id="salesThrough">確認中…</strong></div>
</section>
<section id="notice" class="notice hidden" aria-live="polite"></section>
<section class="search-card"><input id="searchInput" type="search"
placeholder="品番を入力　例：MT → MT401 → MT401MBK" autocomplete="off" disabled></section>
<section id="results"><div class="empty">データを読み込んでいます…</div></section>
<section class="upload-card">
<button id="selectStockBtn" type="button">月曜在庫を取り込む</button>
<input id="stockFileInput" type="file" accept=".xlsx,.xls" hidden>
<div id="uploadState" class="upload-state"></div>
</section>
<iframe id="uploadFrame" name="uploadFrame" class="hidden-frame" title="upload response"></iframe>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="./config.js"></script><script src="./app.js"></script>
</body></html>
